name: Foundation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
  markdown:
    uses: dryvist/.github/.github/workflows/_markdown-lint.yml@9cb1a5f05818fece155c44d70a3b82a0a8442c93
  nix:
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@9cb1a5f05818fece155c44d70a3b82a0a8442c93
    with:
      all_systems: false
  integration:
    name: Local OpenBao and dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3
      - name: Register and exercise two mounts
        run: nix develop -c env BAO_TEST_BINARY=bao go test -race -run TestOpenBaoMounts -v .
      - name: Scan reachable Go vulnerabilities
        run: nix develop -c govulncheck ./...
